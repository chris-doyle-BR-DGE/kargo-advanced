apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: guestbook
  namespace: kargo-advanced
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/chris-doyle-br-dge/guestbook
      imageSelectionStrategy: SemVer
      allowTagsRegexes:
      - ^v?[0-9]+\.[0-9]+\.[0-9]+([\+-].*)?$
  - git:
      repoURL: https://github.com/chris-doyle-br-dge/kargo-advanced.git
      branch: main
